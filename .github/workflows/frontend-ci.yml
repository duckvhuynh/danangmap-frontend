name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_DANANGMAP_DEMO_MODE: "false"
  NEXT_PUBLIC_MAPBOX_TOKEN: ""
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Contract, quality, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Check generated API client
        run: npm run api:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Build production application
        run: npm run build

  docker-smoke:
    name: Non-root container health smoke
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build production image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
          --build-arg NEXT_PUBLIC_DANANGMAP_DEMO_MODE=false
          --build-arg NEXT_PUBLIC_MAPBOX_TOKEN=
          --tag danangmap-frontend:ci .

      - name: Verify non-root runtime and health endpoint
        shell: bash
        run: |
          set -euo pipefail

          image_user="$(docker image inspect danangmap-frontend:ci --format '{{.Config.User}}')"
          if [[ -z "$image_user" || "$image_user" == "root" || "$image_user" == "0" ]]; then
            echo "Expected a non-root image user, received '${image_user:-<empty>}'." >&2
            exit 1
          fi

          container_id="$(docker run --detach --rm --publish 127.0.0.1:3000:3000 danangmap-frontend:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          docker exec "$container_id" sh -c 'test "$(id -u)" -ne 0'

          for _ in {1..30}; do
            if response="$(curl --fail --silent --show-error http://127.0.0.1:3000/api/health 2>/dev/null)"; then
              printf '%s' "$response" | grep --fixed-strings '"status":"ok"'
              exit 0
            fi
            if ! docker inspect "$container_id" --format '{{.State.Running}}' | grep --quiet true; then
              docker logs "$container_id" >&2
              exit 1
            fi
            sleep 2
          done

          docker logs "$container_id" >&2
          echo "Frontend health endpoint did not become ready in 60 seconds." >&2
          exit 1
